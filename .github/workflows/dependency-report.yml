name: Dependency report

# Prints how a dependency resolves in the real app, for diagnosing runtime problems that unit tests cannot see.
on:
  workflow_dispatch:
    inputs:
      dependency:
        description: Dependency to inspect (substring of group or artifact)
        default: protobuf-javalite
      configuration:
        description: Gradle configuration
        default: debugRuntimeClasspath

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolved versions
        run: |
          ./gradlew -q :app:dependencyInsight --dependency "${{ inputs.dependency }}" --configuration "${{ inputs.configuration }}" 2>&1 | head -120
          echo "=== Tink and protobuf together"
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath 2>&1 | grep -iE "tink|protobuf|security-crypto" | sort -u | head -30
