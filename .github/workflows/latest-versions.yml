name: Latest versions

# Planning tool for dependency updates, run on demand. Google's Maven host is only reachable from
# GitHub's runners. Prints, for each AndroidX/Google artifact, its newest stable versions together
# with the compileSdk and AGP they require (read from the AAR), because a library that needs a newer
# compileSdk than the project has fails the build.
on:
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: Android Gradle Plugin 8.x and Compose BOM
        run: |
          G=https://dl.google.com/dl/android/maven2
          stable() { grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|dev|snapshot|eap'; }
          echo "== AGP stable 8.x"
          curl -fsSL "$G/com/android/tools/build/gradle/maven-metadata.xml" | stable | grep '^8\.' | sort -V | tail -12 | tr '\n' ' '; echo
          echo "== Compose BOM 2024.10 .. 2025.12 with the library versions each one pins"
          for v in $(curl -fsSL "$G/androidx/compose/compose-bom/maven-metadata.xml" | stable | sort -V | grep -E '^(2024\.(1[0-2])|2025\.)'); do
            pom=$(curl -fsSL "$G/androidx/compose/compose-bom/$v/compose-bom-$v.pom")
            pick() { echo "$pom" | grep -A1 "<artifactId>$1</artifactId>" | grep -oP '(?<=<version>)[^<]+' | head -1; }
            printf 'BOM %-12s material3=%-8s ui=%-8s material(M2)=%-8s foundation=%s\n' "$v" "$(pick material3)" "$(pick ui)" "$(pick material)" "$(pick foundation)"
          done

      - name: AndroidX and Google artifacts
        run: |
          G=https://dl.google.com/dl/android/maven2
          stable() { grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|dev|snapshot|eap'; }
          meta() {
            # prints the build requirements recorded in the AAR of group/artifact version
            local path="$1/$2/$3/$2-$3.aar"
            if curl -fsSL -o /tmp/x.aar "$G/$path" 2>/dev/null; then
              unzip -p /tmp/x.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null \
                | grep -E '^(minCompileSdk|minAgpVersion)=' | tr '\n' ' '
            else
              printf '(no aar; kotlin multiplatform or jar)'
            fi
          }
          for a in "androidx/core core-ktx" "androidx/appcompat appcompat" "androidx/lifecycle lifecycle-viewmodel-ktx" \
                   "androidx/lifecycle lifecycle-viewmodel-compose" "androidx/activity activity-compose" \
                   "androidx/room room-runtime" "androidx/paging paging-runtime-ktx" "androidx/paging paging-compose" \
                   "androidx/datastore datastore-preferences" "androidx/hilt hilt-navigation-compose" \
                   "androidx/core core-splashscreen" "androidx/sharetarget sharetarget" "androidx/security security-crypto" \
                   "com/google/android/material material" "androidx/test/ext junit-ktx" "androidx/test core" \
                   "androidx/test rules" "androidx/test runner" "androidx/test orchestrator" "androidx/arch/core core-testing" \
                   "androidx/compose/material material" \
                   "androidx/room room-runtime-android" "androidx/room room-ktx" "androidx/room room-paging" \
                   "androidx/datastore datastore-android" "androidx/datastore datastore-core-android" \
                   "androidx/datastore datastore-preferences-android" "androidx/paging paging-common-android" \
                   "androidx/paging paging-runtime" "androidx/lifecycle lifecycle-viewmodel-android" \
                   "androidx/lifecycle lifecycle-viewmodel-compose-android" "androidx/lifecycle lifecycle-runtime-android" \
                   "androidx/lifecycle lifecycle-livedata" "androidx/navigation navigation-compose" \
                   "androidx/compose/runtime runtime-livedata"; do
            set -- $a
            echo "== $1/$2"
            for v in $(curl -fsSL "$G/$1/$2/maven-metadata.xml" | stable | sort -V | tail -8); do
              printf '   %-10s %s\n' "$v" "$(meta "$1" "$2" "$v")"
            done
          done

      - name: Gradle distribution checksums
        run: |
          for v in 8.14.3 8.14.6; do
            printf 'gradle-%s-bin.zip sha256: ' "$v"; curl -fsSL "https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256"; echo
          done

      - name: Requirements of specific candidates
        # Direct dependencies matter as much as the library itself: a newer androidx.core or Compose pulled in
        # transitively raises the compileSdk the whole app needs.
        run: |
          G=https://dl.google.com/dl/android/maven2
          show() {
            local g="$1" a="$2" v="$3" base="$G/$1/$2/$3/$2-$3"
            printf '== %s:%s:%s  ' "${g//\//.}" "$a" "$v"
            if curl -fsSL -o /tmp/c.aar "$base.aar" 2>/dev/null; then
              unzip -p /tmp/c.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null | grep -E '^minCompileSdk=' | tr '\n' ' '
            else printf '(no aar) '; fi; echo
            curl -fsSL "$base.pom" 2>/dev/null | tr -d '\n' | grep -oP '<dependency>.*?</dependency>' \
              | grep -E 'androidx|material' | grep -vE '<scope>test|<optional>true' \
              | sed -E 's#<dependency><groupId>([^<]+)</groupId><artifactId>([^<]+)</artifactId>(<version>([^<]+)</version>)?.*#      \1:\2:\4#' | sort -u
          }
          for c in "androidx/appcompat appcompat 1.7.1" "androidx/appcompat appcompat 1.8.0" \
                   "com/google/android/material material 1.12.0" "com/google/android/material material 1.13.0" \
                   "androidx/paging paging-compose-android 3.3.6" "androidx/paging paging-compose-android 3.4.2" "androidx/paging paging-compose-android 3.5.3" \
                   "androidx/paging paging-runtime-android 3.5.3" \
                   "androidx/room room-runtime-android 2.8.5" "androidx/room room-paging-android 2.8.5" "androidx/room room-ktx 2.8.5" \
                   "androidx/datastore datastore-preferences-android 1.3.0" "androidx/datastore datastore-core-android 1.3.0" \
                   "androidx/lifecycle lifecycle-viewmodel-compose-android 2.8.7" "androidx/lifecycle lifecycle-viewmodel-android 2.8.7" \
                   "androidx/compose/ui ui-android 1.7.8" "androidx/compose/ui ui-android 1.8.3" "androidx/compose/ui ui-android 1.9.1" \
                   "androidx/compose/material3 material3-android 1.3.1" "androidx/compose/material3 material3-android 1.3.2" \
                   "androidx/compose/foundation foundation-android 1.7.8" "androidx/compose/foundation foundation-android 1.8.3" \
                   "androidx/hilt hilt-navigation-compose 1.2.0" "androidx/navigation navigation-compose-android 2.8.9" \
                   "androidx/tracing tracing-android 2.0.1" "androidx/sqlite sqlite-android 2.6.2" \
                   "androidx/sqlite sqlite-framework-android 2.6.2" "androidx/annotation annotation-experimental 1.5.0" \
                   "androidx/datastore datastore-core-android 1.2.1" "androidx/datastore datastore-core-android 1.1.7" \
                   "androidx/graphics graphics-shapes-android 1.0.1" "androidx/arch/core core-runtime 2.2.0"; do
            set -- $c; show "$1" "$2" "$3"
          done
