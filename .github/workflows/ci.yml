name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile first, then test. Running the tests while the app module is still compiling starves
      # the test JVM of CPU on a cold Gradle cache, and the 20 second per-test timeout in BaseUnitTest
      # then fires on a test that is fine (seen on two unrelated tests in two different modules).
      # --continue so one failing module does not hide the results of the others.
      # The instrumented tests need an emulator to run (see ui-tests.yml) but are compiled here, so that a
      # library update that breaks them is noticed.
      - name: Build debug APK and compile the instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --continue --stacktrace

      - name: Unit tests
        if: always()
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Publish test reports
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: './**/build/test-results/**/TEST-*.xml'

      - name: Verify APK identity
        # The package id, label and provider authority must differ from Mealient so both can be installed
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" > badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|application-icon|launchable-activity)" badging.txt
          grep -E "authorities|<permission|uses-permission" manifest.txt || true
          grep -q "^package: name='io.github.cyberbandit1998.copperpot'" badging.txt
          grep -q "application-label.*Copperpot" badging.txt
          if grep -q "gq.kirmanak.mealient.provider" manifest.txt; then
            echo "A provider authority still uses Mealient's id"; exit 1
          fi
          cp "$APK" "copperpot-debug-${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copperpot-debug-apk
          path: copperpot-debug-*.apk

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests'
